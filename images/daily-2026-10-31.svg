<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#132d32"/><g font-family="sans-serif" fill="#f0e5c8"><text x="56" y="72" font-size="34">10/31 · 拯救獅子城</text><text x="56" y="112" font-size="19" fill="#9fc6bd">自製規則示意 · 非遊戲截圖</text><g fill="#244b50" stroke="#9fc6bd"><rect x="55" y="166" width="510" height="292" rx="20"/><rect x="610" y="166" width="535" height="292" rx="20"/></g><text x="88" y="212" font-size="25">四方封印 → 最終Boss</text><text x="88" y="257" font-size="21">1 八岐蛇妖　2 黑暗奧客</text><text x="88" y="301" font-size="21">3 死神黑摸摸　4 哈奈爾</text><text x="88" y="346" font-size="23" fill="#ffbf75">5 坦柏特</text><text x="88" y="414" font-size="21">5點 + 12位村民 + 4×2封印 = 25點</text><text x="646" y="212" font-size="25">AD 寒冰瀑布 ／ DA 隕石</text><text x="646" y="261" font-size="22">蓄氣 3 → 5 → 10 秒</text><text x="646" y="307" font-size="21">馭冰火：詠唱縮短15%／20%／30%</text><text x="646" y="354" font-size="21">弧線瞄準 → 落點預告 → 命中</text><text x="646" y="414" font-size="21" fill="#ffbf75">岩漿寬度 ×4 · 移除灰色測試橋面</text><text x="56" y="532" font-size="23">GitHub Pages + RSS 已發布</text><text x="56" y="574" font-size="19" fill="#9fc6bd">本機規則與載入檢查通過；完整多人實戰、部分原版技能貼圖仍待驗收。</text></g></svg>